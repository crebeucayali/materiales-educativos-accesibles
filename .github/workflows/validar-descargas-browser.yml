name: Validación real de descargas MEA en Chromium
on:
  pull_request:
    paths:
      - 'tests/descargas-mea.browser.mjs'
      - '.github/workflows/validar-descargas-browser.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Servidor local de MEA
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/servidor-mea.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
      - run: node tests/descargas-mea.browser.mjs

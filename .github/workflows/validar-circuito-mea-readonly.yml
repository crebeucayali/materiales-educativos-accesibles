name: Verificar circuito MEA y Supabase sin escrituras
on:
  pull_request:
    paths:
      - 'tests/validacion-etapa2-mea-readonly.mjs'
      - '.github/workflows/validar-circuito-mea-readonly.yml'
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/validacion-etapa2-mea-readonly.mjs
      - run: node tests/validacion-etapa2-mea-readonly.mjs
